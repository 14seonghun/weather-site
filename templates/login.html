<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>로그인</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #1f2d3d; padding: 16px; }
    form { background: #fff; padding: 32px 28px; border-radius: 12px; width: 100%; max-width: 340px;
           box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    h1 { margin: 0 0 20px; font-size: 22px; text-align: center; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccd; border-radius: 8px; }
    button { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; border: 0; border-radius: 8px;
             background: #2980b9; color: #fff; cursor: pointer; }
    button:hover { background: #2471a3; }
    .error { color: #c0392b; font-size: 14px; margin: 10px 0 0; text-align: center; }
  </style>
</head>
<body>
  <form method="post">
    <h1>🔒 비밀번호를 입력하세요</h1>
    <input type="password" name="password" placeholder="비밀번호" autofocus required autocomplete="current-password">
    <button type="submit">접속</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
